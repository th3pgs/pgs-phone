<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
</head>
<body>

  <!-- LANDING PAGE -->
  <div id="landing-page" class="view-section active">
    <div class="landing-content">
      <h1 class="brand-title">THE GALLERY</h1>
      <button id="view-pictures-btn" class="high-contrast-btn">View Collection</button>
      
      <div class="credits-section">
        <h3>Photography By</h3>
        <ul id="credits-list" class="credits-list">
          <li>Saditha Sulakshana (PGS)</li>
        </ul>
      </div>
    </div>
    <div id="secret-trigger"></div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loading-screen" class="view-section">
    <div class="loader-content">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <!-- SECRET CMS / UPLOAD MODAL -->
  <div id="cms-modal" class="hidden">
    <div class="modal-box cms-scrollable">
      
      <div id="cms-inputs">
        <h2>Gallery Management</h2>
        
        <!-- CMS Tabs -->
        <div class="cms-tabs">
          <button id="tab-upload" class="cms-tab active">Upload</button>
          <button id="tab-manage" class="cms-tab">Manage Assets</button>
        </div>

        <div id="view-upload" class="cms-view active">
          <div class="cms-section">
            <h3>Update Photographer Credits</h3>
            <textarea id="credits-input" rows="2" placeholder="Names separated by commas..."></textarea>
            <button id="save-credits-btn" class="high-contrast-btn outline small-btn">Save Credits</button>
          </div>

          <div class="cms-section">
            <h3>Upload Images</h3>
            <div class="file-dropzone" onclick="document.getElementById('image-upload').click()">
              <input type="file" id="image-upload" multiple accept="image/*" style="display:none;">
              <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <p style="margin-top: 10px; font-weight: 600;">Tap to select high-res photos</p>
            </div>
          </div>
        </div>

        <div id="view-manage" class="cms-view">
          <div class="cms-section">
            <div class="manage-header">
              <h3>Delete Assets</h3>
              <div class="manage-actions">
                <button id="select-all-btn" class="small-btn outline">Select All</button>
                <button id="delete-selected-btn" class="small-btn danger">Delete Selected</button>
              </div>
            </div>
            <div id="cms-asset-grid" class="asset-mini-grid">
              <!-- Asset thumbnails load here -->
            </div>
          </div>
        </div>

        <button id="close-cms" class="high-contrast-btn outline" style="width: 100%;">Close CMS</button>
      </div>

      <div id="upload-progress-view" class="hidden">
        <h2>Processing Assets</h2>
        <div id="upload-log" class="terminal-log"></div>
        <button id="finish-upload-btn" class="high-contrast-btn hidden" style="width: 100%; margin-top: 20px;">Return</button>
      </div>

    </div>
  </div>

  <!-- GALLERY GRID PAGE -->
  <div id="gallery-page" class="view-section">
    <header class="gallery-header">
      <button id="back-btn" class="high-contrast-btn outline">← Back</button>
      <h2>Event Timeline</h2>
    </header>
    <div id="gallery-container"></div>
  </div>

  <!-- FULLSCREEN TIKTOK-STYLE VIEWER -->
  <div id="fullscreen-viewer" class="hidden">
    <button id="close-viewer-btn" class="viewer-close">✕</button>
    
    <div id="scroll-onboarding" class="hidden">
      <div class="swipe-icon">
        <svg viewBox="0 0 24 24" width="32" height="32" stroke="#fff" stroke-width="2" fill="none"><polyline points="7 13 12 18 17 13"></polyline><polyline points="7 6 12 11 17 6"></polyline></svg>
      </div>
      <p>Swipe vertically to explore</p>
    </div>

    <!-- Persistent visual scroll hint -->
    <div class="scroll-indicator">↓</div>

    <div id="scroll-container"></div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
