<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <!-- EXIF Reader for exact photo capture time -->
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
</head>
<body>

  <!-- LANDING PAGE -->
  <div id="landing-page" class="view-section active">
    <div class="landing-content">
      <h1 class="brand-title">THE GALLERY</h1>
      <button id="view-pictures-btn" class="high-contrast-btn">View Collection</button>
      
      <div class="credits-section">
        <h3>Photography By</h3>
        <ul id="credits-list" class="credits-list">
          <!-- Defaults to Saditha Sulakshana (PGS), updates live via CMS -->
        </ul>
      </div>
    </div>

    <!-- Hidden Secret Scroll Trigger -->
    <div id="secret-trigger"></div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loading-screen" class="view-section hidden">
    <div class="loader-content">
      <div class="spinner"></div>
      <p>Syncing gallery...</p>
    </div>
  </div>

  <!-- SECRET CMS / UPLOAD MODAL -->
  <div id="cms-modal" class="hidden">
    <div class="modal-box">
      <h2>Gallery CMS</h2>
      
      <div class="cms-section">
        <h3>Update Photographer Credits</h3>
        <textarea id="credits-input" rows="2" placeholder="Names separated by commas..."></textarea>
        <button id="save-credits-btn" class="high-contrast-btn outline small-btn">Save Credits</button>
      </div>

      <div class="cms-section">
        <h3>Upload Images</h3>
        <input type="file" id="image-upload" multiple accept="image/*">
        <div id="upload-status" class="status-text"></div>
      </div>

      <button id="close-cms" class="high-contrast-btn">Close CMS</button>
    </div>
  </div>

  <!-- GALLERY GRID PAGE -->
  <div id="gallery-page" class="view-section hidden">
    <header class="gallery-header">
      <button id="back-btn" class="high-contrast-btn outline">← Back</button>
      <h2>Event Timeline</h2>
    </header>
    <div id="gallery-container">
      <!-- Grouped image partitions load here -->
    </div>
  </div>

  <!-- FULLSCREEN TIKTOK-STYLE VIEWER -->
  <div id="fullscreen-viewer" class="hidden">
    <button id="close-viewer-btn" class="viewer-close">✕</button>
    
    <div id="scroll-onboarding" class="hidden">
      <div class="swipe-icon"></div>
      <p>Swipe to explore</p>
    </div>

    <div id="scroll-container">
      <!-- Fullscreen slides load here -->
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
